services:
  # ─── Backend API ───────────────────────────────────────────────────────────
  - type: web
    name: itab-backend
    runtime: node
    rootDir: itab-backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: itab-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: itab-frontend
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL

  # ─── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: itab-frontend
    runtime: static
    rootDir: itab-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://itab-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: itab-backend
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL

# ─── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: itab-db
    databaseName: itab_db
    user: itab_user
    plan: free
